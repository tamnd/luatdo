version: 2

project_name: luatdo

builds:
  - main: ./cmd/luatdo
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  # Written out rather than left to the default, because install.sh and
  # install.ps1 build this name themselves and a default that changes between
  # goreleaser versions would break every install with a 404.
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: github
